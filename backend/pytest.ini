[pytest]
; Version 2.0.0 (2026-11-20). 1.x had no pytest config at all, so the
; `pytestmark = pytest.mark.asyncio` in the test module needed plugin settings
; that did not exist and `cd backend && pytest` — as the README documents —
; failed before collecting a single test.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
